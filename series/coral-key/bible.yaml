# Series bible: everything the episode planner and scene artist must stay consistent with.
# Edit freely: names, looks, voices and the season arc are all read fresh for every episode.

title: "Coral Key"
logline: >
  A charter yacht sinks in a storm. Leo, the quiet boat mechanic, washes up on a tiny
  island with four passengers who blame him for the sinking and treat him like the help.
  Every part they push him out, mock him or sabotage him, and every part he outsmarts
  the island and them, while clues reveal what really sank the yacht, until the day he
  gets everyone rescued.
format:
  platform: TikTok (9:16 vertical)
  parts: 10
  episode_length_seconds: [62, 75]      # just over 1 minute: counts for Creator Rewards, still fast
  shots_per_episode: [12, 16]           # each shot is one clip/still; many short shots = fast pace
  shot_seconds: [3, 6]
  max_lines_per_shot: 2
  max_words_per_line: 12
  spoken_words_per_episode: [140, 185]
  structure:
    - "Shot 1 (0-2 s) is the HOOK: open mid-action on the most dramatic or funniest moment of this part, with one sharp line. Never start with scenery, a recap or narration."
    - "If there is a previous part, shots 1-2 must pay off its cliffhanger immediately."
    - "Every 3-4 shots something changes: a new obstacle, a reveal, a reversal or a joke landing."
    - "Around 70% through: Leo's clever fix or comeback, shown, not explained."
    - "Last shot is the CLIFFHANGER: a new threat, a reveal or a question, cut on the line. No wrap-up."
    - "Each part also drops or advances one clue in the season mystery."
  narration: "Leo's narration is rare and dry, one short line at most per shot. Prefer on-screen dialogue and reactions."
  dialogue: "Short, punchy, quotable lines. No exposition dumps. Characters interrupt each other."

title_card: "CORAL KEY · PART {n}/{total}"   # shown for the first 1.8 s of every part
captions:
  font: BeVietnamPro-Bold.ttf
  font_size: 74
  stroke_width: 4
  position_percent: 70                  # from the top; clear of faces, above the TikTok UI

render:
  # drawn: Claude-drawn illustrated stills + local Kokoro voices (free).
  # realistic: live-action clips with spoken dialogue from Gemini Omni Flash
  #            (needs GEMINI_API_KEY; about $0.07 per second of 720p video).
  visuals: realistic
  video_model: gemini-omni-1.2-flash
  image_model: gemini-3.1-flash-image
  resolution: 720p

tone: >
  Survival comedy-drama. Petty camp politics, slapstick mishaps, satisfying comebacks.
  Leo wins through skill, patience and wit, never through cruelty.

guardrails:
  - "The women are full characters with their own motives, fears and growth arcs, never one-note stereotypes."
  - "No romance, sexual content, nudity or innuendo. Nobody is in swimwear close-ups."
  - "Conflict stays at pettiness, pranks, exclusion and arguments. No assault, no lasting injuries, no gore."
  - "Leo's wins come from competence. He never humiliates anyone back; he out-builds and out-thinks them."
  - "By the end of the season each woman has earned at least one moment of respect or redemption."

art_style: >
  Flat modern vector illustration, bold clean shapes, soft gradients avoided,
  warm tropical palette (teal sea #1FA4A8, sand #F2D49B, jungle #2E7D4F, sunset #F28C38,
  night #1B2A4A). Characters drawn in a consistent cartoon style: oval heads,
  simple dot eyes with small white highlights, expressive eyebrows, no text anywhere.
  Full-bleed 1080x1920 portrait canvas, characters large in frame, readable at phone size.

protagonist: leo   # always gets a reference slot when in frame (realistic visuals)

characters:
  leo:
    name: Leo
    role: "Protagonist and narrator. Former boat mechanic on the yacht, 30, calm, inventive, dry humor."
    look: "Medium-brown skin (#8D5A3B), short black curly hair, light stubble, rolled-sleeve faded blue work shirt (#3D6FA8), khaki shorts (#B59B6A), barefoot, carries a small orange multitool (#F28C38)."
    voice: "kokoro:am_michael"
    voice_style: "calm, dry, low-pitched American male voice"   # how the realistic video model speaks their lines
  vanessa:
    name: Vanessa
    role: "Self-appointed leader, startup CEO, 35. Gives orders, takes credit, terrified of losing control. Arc: learns to listen."
    look: "Light skin (#F1C9A5), sleek platinum-blonde bob, large white sunglasses pushed up on her head, tailored white blazer over a coral top (#F2665E), gold hoop earrings."
    voice: "kokoro:af_bella"
    voice_style: "crisp, cool, commanding American female voice"   # how the realistic video model speaks their lines
  jade:
    name: Jade
    role: "Fitness coach, 28, competitive and mocking, hates being outdone. Arc: becomes Leo's grudging teammate."
    look: "Dark brown skin (#5C3A21), high box-braid ponytail with purple accents (#7B4FB0), neon-green sports top (#7BD94C), black leggings, sweatband on her wrist."
    voice: "kokoro:af_nicole"
    voice_style: "energetic, teasing, confident American female voice"   # how the realistic video model speaks their lines
  priya:
    name: Priya
    role: "Corporate lawyer, 33, writes camp 'rules' on bark that always favor the group over Leo. Arc: rewrites the rules to be fair."
    look: "Tan skin (#C68E5E), long straight black hair in a low ponytail, thin round glasses, navy button-up shirt (#22355E) with sleeves rolled, small notebook."
    voice: "kokoro:bf_emma"
    voice_style: "precise, clipped British female voice"   # how the realistic video model speaks their lines
  mia:
    name: Mia
    role: "Youngest, 22, art student, follows the group to fit in but secretly helps Leo. Arc: stands up to the others."
    look: "Light-olive skin (#E0B48C), messy auburn bun (#A0442A) with a yellow scrunchie, oversized mustard-yellow hoodie (#E8B73A), denim shorts, paint smudge on one cheek."
    voice: "kokoro:af_sky"
    voice_style: "soft, warm, slightly hesitant young American female voice"   # how the realistic video model speaks their lines

setting:
  island: "Coral Key: a small crescent island with a white beach, palm grove, a rocky hill with a cave, a freshwater stream inland, and the half-sunk yacht wreck on the reef."
  camp: "The women's camp is on the beach under a tarp from the wreck. Leo is pushed to the windy rocky point at the far end."

season_mystery: >
  Why did the yacht sink? Vanessa tells everyone the mechanic (Leo) ignored a leak, which
  is why the group treats him like a liability. Clues: a silenced bilge-pump alarm, Vanessa's
  smartwatch log, a pulled fuse in Leo's toolkit that isn't his. Truth (revealed in Part 8):
  Vanessa switched off the "annoying" beeping alarm herself the night of the storm. Her guilt
  is why she needed someone to blame. She confesses and apologises in Part 10.

season_arc:
  - "Part 1 - Washed ashore: Vanessa blames Leo for the sinking and claims the only tarp. Leo builds a better shelter from the wreck. Cliffhanger: Leo finds the bilge-pump alarm was switched off by hand."
  - "Part 2 - Camp rules: Priya's bark rules give Leo all the work and none of the food. He builds a fish trap; Jade bets she can out-fish him and loses. Cliffhanger: the water bottles are empty."
  - "Part 3 - Thirst: Vanessa rations water to everyone but Leo. Leo finds the inland stream and builds a filter. Cliffhanger: Mia is caught bringing Leo food."
  - "Part 4 - Storm night: the tarp camp floods; the women have to ask Leo for shelter. He lets them in without a word. Cliffhanger: in the dark, Leo sees Vanessa hiding her smartwatch."
  - "Part 5 - Ship on the horizon (midpoint): a ship passes; Jade grabs the flare gun to prove herself and fires it wrong. The ship sails on. Cliffhanger: Jade is swept off the rocks by the tide."
  - "Part 6 - The rescue: Leo pulls Jade out; she owes him and starts helping. Mia is kicked out of camp for siding with Leo and joins him. Cliffhanger: someone has smashed Leo's water filter."
  - "Part 7 - Sabotage: everyone suspects everyone. Vanessa sprains her ankle searching the hill; Leo carries her back and splints it. Cliffhanger: Priya reads Vanessa's smartwatch log: 'Alarm silenced, 2:14 a.m.'"
  - "Part 8 - The truth: Priya confronts Vanessa in front of everyone. Vanessa admits she silenced the alarm. The camp turns on her; Leo stops them. Cliffhanger: Leo says the yacht's radio might still work."
  - "Part 9 - Power: Priya rewrites the rules ('Leo runs anything that floats'). The whole group, for the first time, follows Leo's plan to salvage the radio and build a hand-crank generator. Cliffhanger: the radio crackles, then dies."
  - "Part 10 - Signal: one last fix, a voice answers, and a ship's lights appear at dusk. On the rescue boat Vanessa finally apologises and thanks Leo in front of everyone. Final shot: Leo looks back at the island and smiles."
